<script>
(()=>{
const root=document.getElementById('pi-personal');
const q=s=>root.querySelector(s),qa=s=>Array.from(root.querySelectorAll(s));
const state={page:'conversation',spacing:30};
const labels={skills:'Skills',instructions:'Instructions',prompts:'Prompt templates',models:'Models & providers',tools:'Tools & extensions',packages:'Packages',trials:'Trials',settings:'Settings'};
const icons={conversation:'message-square',skills:'book-open',instructions:'file-text',prompts:'terminal',models:'cpu',tools:'wrench',packages:'package',trials:'flask-conical',settings:'settings'};
function clone(id){return q(id).content.cloneNode(true)}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function navButton(label,page,cls){const b=el('button',undefined,cls);b.type='button';const i=el('i');i.dataset.lucide=icons[page]||'message-square';i.setAttribute('aria-hidden','true');b.append(i,el('span',label));b.setAttribute('aria-pressed',String(state.page===page));b.onclick=()=>{state.page=page;render()};return b}
function nav(){const n=q('#pi-navigation');n.replaceChildren();n.append(navButton('New conversation','new'));n.append(el('div','PROJECTS','eyebrow'));n.append(navButton('pi-dashboard','conversation'));n.append(navButton('Review settings editor','conversation','recent'));n.append(el('div','CUSTOMIZE','eyebrow'));for(const p of ['skills','instructions','prompts','models','tools','packages','trials'])n.append(navButton(labels[p],p));const end=el('div',undefined,'rail-end');end.append(navButton('Settings','settings'));n.append(end)}
function title(main,eyebrow,name,sub){const top=el('div',undefined,'page-title'),wrap=el('div');wrap.append(el('span',eyebrow,'tiny'));const h=el('h2',name);h.style.marginTop='6px';wrap.append(h);if(sub)wrap.append(el('span',sub,'tiny'));top.append(wrap);main.append(top)}
function row(main,name,detail,control){const r=el('div',undefined,'resource-row'),text=el('div');text.append(el('strong',name),el('span',detail,'tiny'));r.append(text);if(control)r.append(control);main.append(r)}
function choose(values,label){const s=el('select');s.setAttribute('aria-label',label);values.forEach(v=>s.append(el('option',v)));return s}
function toggle(label){const i=el('input');i.type='checkbox';i.checked=true;i.setAttribute('aria-label',label);return i}
function action(text,fn){const b=el('button',text,'button');b.type='button';b.onclick=fn;return b}
function resourcePage(main){const p=state.page;title(main,'CUSTOMIZE / THIS PROJECT',labels[p]||'New conversation','Example configuration');
if(p==='instructions'){row(main,'Your global instructions','~/.pi/agent/AGENTS.md',el('span','Inherited','chip'));row(main,'Project conventions','pi-dashboard/AGENTS.md',el('span','Project','chip'));const label=el('label','Project instructions','field');const t=el('textarea');t.rows=7;t.value='This is my personal project.\n\nPrefer a useful end-to-end experience.\nPreserve unrelated configuration.\nAsk before consequential external actions.\nStop once the agreed slice works.';label.append(t);label.style.marginTop='20px';main.append(label);const d=el('details',undefined,'trace');d.append(el('summary','Preview combined instructions'));const txt=el('pre','[Global instructions]\nBe direct and explain material decisions.\n\n[Project instructions]\n'+t.value,'detail');d.append(txt);t.oninput=()=>txt.textContent='[Global instructions]\nBe direct and explain material decisions.\n\n[Project instructions]\n'+t.value;main.append(d)}
else if(p==='models'){row(main,'Provider','Existing authentication',el('span','openai-codex','chip'));row(main,'Default model','Inherited from your pi settings',el('span','gpt-5.6-sol'));row(main,'Thinking','Override for this project',choose(['Use inherited · high','Medium','Low'],'Project thinking'));row(main,'Available models','The real app will read your pi model catalog.');}
else if(p==='prompts'){row(main,'/review','Review my current changes',el('span','Project','chip'));row(main,'/research','Find primary sources and cite the evidence',el('span','Global','chip'));const l=el('label','Review prompt','field');const t=el('textarea');t.value='Review $@ for concrete bugs. Follow the project-review skill and give actionable findings.';l.style.marginTop='20px';l.append(t);main.append(l)}
else if(p==='tools'){for(const [a,b] of [['Read','Inspect file contents'],['Edit & write','Make changes in the working project'],['Shell','Run commands with the launching process permissions']])row(main,a,b,toggle('Enable '+a));row(main,'Extensions','No extensions included in this example.');main.append(el('p','Tool switches are configuration controls, not a filesystem sandbox.','note'));}
else if(p==='packages'){row(main,'Local project-review skill','Authored by you; no package required',el('span','Local','chip'));row(main,'pi-skills','Skill collection · candidate to inspect',el('span','Not installed','tiny'));row(main,'mitsupi','Skills, extensions, and prompts · candidate to inspect',el('span','Not installed','tiny'));main.append(el('p','Start with the capabilities you need. No marketplace or team setup required.','note'))}
else if(p==='trials'){row(main,'Review the settings editor','Saved skill revision · sample conversation',action('Open',()=>{state.page='conversation';render()}));row(main,'Current skill draft','No trial yet',action('Open draft',()=>{state.page='skills';render()}))}
else if(p==='settings'){row(main,'Automatic compaction','Use pi defaults',toggle('Automatic compaction'));row(main,'Retries','Handle transient failures',toggle('Retries'));row(main,'pi terminal theme','Independent of this browser app',choose(['Dark','Light'],'Terminal theme'));row(main,'Scope','Where a future save would write',choose(['This project','My defaults'],'Settings scope'));}
main.append(el('p','Edits here are temporary design previews.','note'));}
function wire(){qa('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='edit-skill'){state.page='skills';render()}else if(a==='instructions'){state.page='instructions';render()}else if(a==='diff'){const d=q('[data-diff]');d.hidden=!d.hidden}else if(a==='send'){const t=q('.composer textarea');q('.composer .live-note').textContent=t.value.trim()?'Message previewed. This mockup does not send to pi.':'Write a message to preview.'}else if(a==='review-skill'){q('[data-skill-output]').textContent='---\nname: project-review\ndescription: '+JSON.stringify(q('[data-description]').value)+'\n---\n\n'+q('[data-instructions]').value;q('[data-skill-review]').hidden=false}else if(a==='try-skill'||a==='trial-preview'){q('[data-trial-preview]').hidden=false}});const thinking=q('[aria-label="Inspector thinking"]');if(thinking)thinking.onchange=()=>q('[data-thinking-note]').textContent='Draft selection only; no session changed.'}
function render(){nav();const main=q('#pi-center'),side=q('#pi-inspector'),space=q('#pi-workspace');main.replaceChildren();side.replaceChildren();side.hidden=true;space.className='workspace';
if(state.page==='conversation'||state.page==='new'){main.append(clone('#pi-chat-template'));if(state.page==='new'){main.replaceChildren();title(main,'PI-DASHBOARD','What are we working on?','A new conversation with your pi harness.');const c=clone('#pi-chat-template');main.append(c.querySelector('.composer'));}side.hidden=false;side.append(clone('#pi-inspector-template'));space.className='workspace inspected';}
else if(state.page==='skills'){main.append(clone('#pi-skill-template'));side.hidden=false;side.append(clone('#pi-trial-template'));space.className='workspace studio'}else resourcePage(main);
q('#pi-caption').textContent=state.page==='skills'?'Skill editor and conversation':(state.page==='conversation'||state.page==='new'?'Conversation and harness inspector':labels[state.page]);wire();style();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}})}
function style(){q('#pi-center').style.padding=state.spacing+'px'}render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:style});tweak.addSlider(state,'spacing',{label:'Workspace breathing room',min:16,max:36,unit:'px'});}
})();
</script>
